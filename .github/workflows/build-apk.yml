name: Build & Release Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > "${{ github.workspace }}/debug.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
          fi

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH || secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Output Directory
        run: |
          mkdir -p output_apk
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk output_apk/ScreenCaptureOverlay-release.apk
          else
            echo "Release APK not found, checking debug APK fallback..."
            cp app/build/outputs/apk/debug/*.apk output_apk/ScreenCaptureOverlay-release.apk
          fi
          echo "Generated APK file list:"
          ls -la output_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCaptureOverlay-release-apk
          path: output_apk/ScreenCaptureOverlay-release.apk
          retention-days: 30

      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "Publishing Release $TAG..."
          gh release create "$TAG" output_apk/ScreenCaptureOverlay-release.apk \
            --title "Screen Capture Overlay $TAG" \
            --notes "Otomatik derlenen Android Release APK paketi. Telefonunuza indirip doğrudan kurabilirsiniz." \
            --target "${{ github.sha }}" || echo "Release creation skipped or handled"

      - name: Fallback Release Upload
        uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Screen Capture Overlay v1.0.${{ github.run_number }}"
          files: output_apk/ScreenCaptureOverlay-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
